<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffffff'/%3E%3Crect x='8.5' y='6.5' width='15' height='19' rx='2' fill='none' stroke='%231F5AA6' stroke-width='1.6'/%3E%3Cpath d='M12 12h8M12 16h8M12 20h5' stroke='%231F5AA6' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>案头 · 文献、数据与邮件工作台</title>
    <meta
      name="description"
      content="给做实验、写综述的研究生用的桌面式工作台：论文问答带原文引用，实验数据一键出报表并导出，结果直接发邮件给导师。"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- file:// 打开时 ES module 会被浏览器拦掉，直接白屏。这里给个明确的出口，别让人对着白屏猜。 -->
    <script>
      if (location.protocol === 'file:') {
        document.documentElement.innerHTML =
          '<head><meta charset="utf-8"><title>案头 · 请用启动脚本打开</title></head><body style="margin:0;font:14px/1.7 -apple-system,\'Segoe UI\',sans-serif;background:#e8ebf0;color:#14181f">' +
          '<div style="max-width:560px;margin:14vh auto;padding:28px 30px;background:#fff;border:1px solid #cbd1da;border-radius:8px;box-shadow:0 8px 30px rgba(16,23,37,.07)">' +
          '<div style="font-size:19px;font-weight:600;letter-spacing:-.01em">请用启动脚本打开</div>' +
          '<p style="color:#57647a;margin:10px 0 16px">直接双击 index.html 打不开——浏览器不允许 <code style="background:#f2f4f7;padding:1px 4px;border-radius:4px">file://</code> 加载 ES 模块，页面一定是白的。</p>' +
          '<p style="margin:0 0 6px">正确做法（二选一）：</p>' +
          '<ol style="color:#57647a;margin:0 0 16px;padding-left:20px">' +
          '<li>双击同目录下的 <b style="color:#101725">启动.bat</b>（Windows）或跑 <b style="color:#101725">./start.sh</b></li>' +
          '<li>命令行执行 <code style="background:#f2f4f7;padding:1px 4px;border-radius:4px">python serve.py --open</code></li>' +
          '</ol>' +
          '<p style="color:#96a0b2;font-size:12px;margin:0">需要 Python 3.9 及以上，不用装任何第三方包。</p>' +
          '</div></body>'
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
